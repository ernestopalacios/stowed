[mgr]

ratio = [1,4,3]
sort_by = "natural"
linemode = "size"
preview_method = "kitty"

[preview]

max_height = 1080
max_width = 1080
tab_size = 3
image_quality = 90
image_interpolation = "linear" # Options: "nearest", "linear", "cubic"

[preview.pdf]
quality = 90


# --- OPENERS (Command Definitions) ---
[opener]
edit       = [{ run = 'micro %s1',       block = true }]
subl       = [{ run = 'subl %s1',        block = true }]
pdf        = [{ run = 'zathura %s1',     block = false, orphan = true }]
tdf        = [{ run = 'tdf %s1',         desc = "tdf", block = true, for = "unix" }]
open       = [{ run = 'xdg-open %s1',    desc = "Default", for = "unix" }]
abrir      = [{ run = 'nautilus %s1', desc = "Archivos", for = "unix" }]
xnview     = [{ run = 'xnviewmp %s1', block = false, orphan = true, desc = "XnViewMP" }]
libre      = [{ run = 'libreoffice %s1', desc = "LibreOffice", block = false, orphan = true }]
only       = [{ run = 'onlyoffice-desktopeditors %s1', desc = "OnlyOffice", block = false, orphan = true }]
view_icat  = [{ run = 'clear; kitty +kitten icat --hold %s1', block = true, orphan = false, desc = "Ver con icat" }]
satty      = [{ run = 'satty --filename %s1 --output-filename %s1 --early-exit', orphan = true, desc = "Annotate with Satty", block = false }]
fast = [{ run = 'env -u DISPLAY WINEPREFIX="$HOME/.local/share/wineprefixes/faststone" wine "$HOME/.local/share/wineprefixes/faststone/drive_c/Program Files (x86)/FastStone Image Viewer/FSViewer.exe" %s1', desc = "FastStone", block = false }]
extract    = [{ run = 'ouch d -y %s', desc = "Extract here with ouch", for = "unix" }]
# --- RULES (Association) ---
[open]
prepend_rules = [

  { mime = "text/{txt,c,dat}", use = ["edit","subl", "open", "abrir"] },
  { mime = "application/{pdf}",  use = ["tdf", "pdf", "open", "abrir"] },
  { mime = "application/{doc,docx,xls,xlsx}", use = ["only","open", "libre", "abrir"]},
  { mime = "image/*", use = ["view_icat", "open", "xnview", "satty","fast", "abrir"] },

  # Extract archives by default
  { mime = "application/{*zip,x-tar,x-bzip2,x-7z-compressed,x-rar,vnd.rar,x-xz,xz,x-zstd,zstd,java-archive}", use = ["extract", "open", "abrir"] },

  # Overwrite fallback
  { url = "*", use = [ "open","edit", "xnview", "abrir", "only", "satty", "fast" ] },
]




# --- PLUGINS ---
[plugin]

prepend_previewers = [
    # Ouch (Compression)
    { mime = "application/*zip",            run = "ouch" },
    { mime = "application/x-tar",           run = "ouch" },
    { mime = "application/x-bzip2",         run = "ouch" },
    { mime = "application/x-7z-compressed", run = "ouch" },
    { mime = "application/x-rar",           run = "ouch" },
    { mime = "application/vnd.rar",         run = "ouch" },
    { mime = "application/x-xz",            run = "ouch" },
    { mime = "application/xz",              run = "ouch" },
    { mime = "application/x-zstd",          run = "ouch" },
    { mime = "application/zstd",            run = "ouch" },
    { mime = "application/java-archive",    run = "ouch" },
    { url = '*.typ', run = 'preview-typst' },

]

prepend_preloaders = [
    { url = '*.typ', run = 'preview-typst' },
]

